version: 2.1

jobs:
  build-debian-cloud:
    machine: true
    steps:
      - checkout

      - run:
          name: 安装工具
          command: |
            sudo apt update
            sudo apt install -y libguestfs-tools axel qemu-utils

      - run:
          name: 下载 Debian Cloud Image
          command: |
            axel -n 8 -o debian-13.qcow2 https://cdimage.debian.org/images/cloud/trixie/latest/debian-13-genericcloud-amd64.qcow2

      - run:
          name: 下载额外工具 (duf, tcping)
          command: |
            mkdir -p tools
            curl -fL -o tools/duf_0.9.1_linux_amd64.deb \
              https://github.com/muesli/duf/releases/download/v0.9.1/duf_0.9.1_linux_amd64.deb
            curl -fL -o tools/tcping-linux-amd64-static.tar.gz \
              https://github.com/pouriyajamshidi/tcping/releases/latest/download/tcping-linux-amd64-static.tar.gz
            tar -xzf tools/tcping-linux-amd64-static.tar.gz -C tools
            chmod +x tools/tcping
            ls -lh tools

      - run:
          name: 解锁内核（仅限 CI 使用）
          command: |
            sudo dpkg-statoverride --update --add root root 0644 /boot/vmlinuz-$(uname -r)

      - run:
          name: 定制镜像
          command: |
            virt-customize -a debian-13.qcow2 \
              --smp 2 \
              --timezone Asia/Hong_Kong \
              --append-line "/etc/default/grub:# disables OS prober to avoid loopback detection which breaks booting" \
              --append-line "/etc/default/grub:GRUB_DISABLE_OS_PROBER=true" \
              --run-command "update-grub" \
              --run-command "systemctl enable serial-getty@ttyS1.service" \
              --run-command "systemctl enable qemu-guest-agent.service" \
              --run-command "sed -i -E 's|Types: deb deb-src|Types: deb|g; s|https?://deb\.debian\.org|https://mirrors.ustc.edu.cn|g' /etc/apt/sources.list.d/debian.sources" \
              --run-command "sed -i 's|generate_mirrorlists: true|generate_mirrorlists: false|g' /etc/cloud/cloud.cfg.d/01_debian_cloud.cfg" \
              --append-line "/etc/ssh/sshd_config.d/01-root-login.conf:PermitRootLogin yes" \
              --append-line "/etc/ssh/sshd_config.d/01-root-login.conf:PasswordAuthentication yes" \
              --append-line "/etc/cloud/cloud.cfg.d/99-enable-root.cfg:disable_root: false" \
              --append-line "/etc/cloud/cloud.cfg.d/99-enable-root.cfg:ssh_pwauth: true" \
              --upload tools/duf_0.9.1_linux_amd64.deb:/tmp/duf_0.9.1_linux_amd64.deb \
              --upload tools/tcping:/tmp/tcping \
              --run-command "dpkg -i /tmp/duf_0.9.1_linux_amd64.deb" \
              --run-command "install -m 0755 /tmp/tcping /usr/local/bin/tcping" \
              --run-command "rm -f /tmp/duf_0.9.1_linux_amd64.deb /tmp/tcping" \
              --update \
              --install "sudo,qemu-guest-agent,spice-vdagent,bash-completion,unzip,wget,curl,axel,net-tools,iputils-ping,iputils-arping,iputils-tracepath,nano,most,screen,less,vim,bzip2,lldpd,mtr-tiny,htop,dnsutils,zstd" \
              --run-command "apt-get -y autoremove --purge && apt-get -y clean" \
              --append-line "/etc/systemd/timesyncd.conf:NTP=time.apple.com time.windows.com" \
              --delete "/var/log/*.log" \
              --delete "/var/lib/apt/lists/*" \
              --delete "/var/cache/apt/*" \
              --truncate "/etc/machine-id"

      - run:
          name: 压缩镜像
          command: |
            virt-sparsify --compress debian-13.qcow2 debian-13-custom.qcow2

      - persist_to_workspace:
          root: .
          paths:
            - debian-13-custom.qcow2

  upload-to-release:
    machine: true
    steps:
      - checkout
      - attach_workspace:
          at: .

      - run:
          name: 安装最新版 GitHub CLI
          command: |
            type -p curl >/dev/null || sudo apt install curl -y
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | \
              sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg && \
              sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg && \
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | \
              sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null && \
              sudo apt update && \
              sudo apt install gh -y

      - run:
          name: 上传到 GitHub Release（最终版）
          command: |
            export GITHUB_TOKEN=$GH_TOKEN
            TAG_NAME="${CIRCLE_TAG:-manual-$(date +%s)}"
            echo "上传到 Release: $TAG_NAME"

            ls -lh debian-13-custom.qcow2 || (echo "镜像文件不存在" && exit 1)

            # 如果 Release 不存在，则创建
            if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
              gh release create "$TAG_NAME" \
                --title "Debian Cloud Image $TAG_NAME" \
                --notes "自动发布自定义镜像"
            fi

            # 上传镜像文件
            gh release upload "$TAG_NAME" debian-13-custom.qcow2 --clobber
      - run:
          name: 同步镜像到 latest Release
          command: |
            gh release upload latest debian-13-custom.qcow2 --clobber || echo "latest 不存在，跳过上传"

workflows:
  build_and_release:
    jobs:
      - build-debian-cloud:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - upload-to-release:
          requires:
            - build-debian-cloud
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
